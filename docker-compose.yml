version: '3'

volumes:
  pg_data:
  collected_static:
  static_frontend:
  media:

services:
  db:
    image: postgres:13
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    restart: always
    env_file: .env
    volumes:
      - collected_static:/app/collected_static/
      - media:/app/media/
    depends_on:
      - db

  frontend:
    build: ./frontend/
    restart: always
    env_file: .env
    command: cp -r /app/build/. /app/static/
    volumes:
      - static_frontend:/app/static/

  gateway:
    build: ./nginx/
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - static_frontend:/app/static/
      - collected_static:/app/collected_static/
      - media:/app/media/
    depends_on:
      - backend
      - frontend
